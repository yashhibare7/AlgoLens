# Zero-infrastructure profile: file-backed H2, no Docker, no PostgreSQL needed.
# Data lives in backend/data/algolens.mv.db so execution history survives restarts.
spring:
  datasource:
    url: jdbc:h2:file:./data/algolens;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.algolens: DEBUG
