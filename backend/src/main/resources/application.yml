spring:
  application:
    name: algolens-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never touch it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.algolens: ${ALGOLENS_LOG_LEVEL:INFO}

algolens:
  cors:
    # Comma separated list of allowed browser origins.
    allowed-origins: ${ALGOLENS_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}
  jwt:
    # MUST be overridden in every non-dev environment. Minimum 32 bytes for HS256.
    secret: ${ALGOLENS_JWT_SECRET:dev-only-insecure-secret-change-me-please-32-bytes-min}
    issuer: algolens
    expiry-minutes: ${ALGOLENS_JWT_EXPIRY_MINUTES:1440}
  execution:
    allow-anonymous: ${ALGOLENS_ALLOW_ANONYMOUS_EXECUTION:true}
    max-code-length: 20000
    max-steps: 200000
    max-trace-events: 20000
    wall-clock-timeout-ms: 5000
    max-output-chars: 20000
    max-call-depth: 200
    max-array-length: 10000
    # Traces larger than this (serialized JSON bytes) are not persisted to history.
    max-persisted-trace-bytes: 3000000
  credits:
    # Turn this on when you want credits to actually gate requests. Off during development.
    enforced: ${ALGOLENS_CREDITS_ENFORCED:false}
    signup-grant: 100
    monthly-grant: 100
    cost-execution: 1
    cost-ai-explanation: 5
    cost-ai-analysis: 10
  ai:
    enabled: ${ALGOLENS_AI_ENABLED:true}
    # When no API key is present the service falls back to the deterministic
    # rule-based explainer, so the product still works end to end.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ALGOLENS_AI_MODEL:claude-opus-5}
    max-tokens: 1200
    effort: MEDIUM
    timeout-seconds: 60
