server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves clients on stale asset URLs.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API calls go to the backend container. Same origin from the browser's point of view,
    # so CORS is not involved in production either.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Interpreting a long trace can take a few seconds; the default 60s is plenty but the
        # timeouts are stated explicitly so they are not a surprise later.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
